services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=prod
      - APP_NAME=${APP_NAME:-Launchpad}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - ENABLE_AUTH=${ENABLE_AUTH:-false}
      - ENABLE_UPLOADS=${ENABLE_UPLOADS:-false}
      - ENABLE_AI=${ENABLE_AI:-false}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me-please-32-bytes-min}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped

  # Опциональный PostgreSQL для проектов, требующих реляционную СУБД:
  # Чтобы включить: раскомментируйте блок ниже и укажите DATABASE_URL в .env:
  # DATABASE_URL=postgresql+psycopg://app:app@db:5432/app
